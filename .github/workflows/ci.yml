name: ATTACKTRACE CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-matrix:
    name: Test & Audit (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest
          pip install -e .

      - name: Run Flake8 Linter
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Bandit Security Scanner
        run: |
          bandit -r src/ -x tests/ -ll

      - name: Run Full Test Suite (Pytest)
        run: |
          pytest -v

      - name: CLI Smoke Test (Version & Status)
        run: |
          attacktrace --version
          attacktrace status

      - name: CLI Smoke Test (Breach Simulation)
        run: |
          attacktrace demo --scenario windows
