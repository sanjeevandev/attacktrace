name: ATTACKTRACE CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: Lint & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8 Linter
        run: flake8 .

      - name: Run Bandit Security Scanner
        run: bandit -r src/ -x tests/ -ll

  test-suite:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests via Pytest
        run: pytest --maxfail=1 --disable-warnings -q

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [lint-and-security, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Engine Docker Image
        run: |
          docker build -t attacktrace-engine:test -f Dockerfile .

      - name: Verify Container Boot Health
        run: |
          docker run -d --name test-engine -p 8000:8000 attacktrace-engine:test
          # Wait up to 30 seconds for health check / ready response
          success=false
          for i in {1..15}; do
            if curl -s http://localhost:8000/api/v1/stats > /dev/null; then
              success=true
              break
            fi
            echo "Waiting for engine..."
            sleep 2
          done
          docker stop test-engine
          docker rm test-engine
          if [ "$success" = false ]; then
            echo "Healthcheck verification failed"
            exit 1
          fi
          echo "Healthcheck passed successfully!"
